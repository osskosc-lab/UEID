name: Market-UEID v0.1 Falsification Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/market-ueid-v0.1
    paths:
      - 'Market-UEID/**'
      - '.github/workflows/market-ueid-v01.yml'

jobs:
  market-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn networkx matplotlib reportlab requests yfinance
      - name: Freeze preregistration checksum
        run: |
          sha256sum Market-UEID/preregistration.json | tee Market-UEID/preregistration.sha256
          cat Market-UEID/preregistration.json
      - name: Run Market-UEID v0.1 falsification pilot
        run: python Market-UEID/run_market_ueid.py
      - name: Print frozen decision
        run: cat results/market_ueid_v01/market_ueid_summary.json
      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-ueid-v01-falsification-results
          path: |
            results/market_ueid_v01/
            Market-UEID/preregistration.json
            Market-UEID/preregistration.sha256
          if-no-files-found: error
